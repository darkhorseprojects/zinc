circuitry: "0.3.2"
title: "Zinc context compaction"
description: |
  Converts the middle of a Zinc session transcript into a durable summary that
  can be inserted between preserved first messages and the exact transcript tail.
runtime:
  provider: zinc
  model: inherit
resources:
  session_log:
    type: text
    label: "Session log to compact"
    value: ""
  compaction:
    type: agent
    identity: "Context compaction"
    inputs: [session_log]
    expect:
      summary: str
    instructions: |
      Compact the supplied Zinc session log into durable conversation memory.

      Preserve:
      - user goals, constraints, preferences, and corrections
      - decisions made by the assistant or user
      - files, commands, errors, test results, and tool outcomes that matter
      - unresolved questions and current task state

      Drop:
      - chit-chat with no future bearing
      - duplicate runtime boilerplate
      - exact wording unless it matters
      - failed speculation superseded by later facts

      Write a dense summary that can sit between exact opening messages and an
      exact recent transcript tail. Do not answer the user. Do not add advice.
      Output ONLY valid JSON matching: {"summary": str}
