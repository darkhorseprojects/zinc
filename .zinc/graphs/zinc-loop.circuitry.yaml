circuitry: "0.4"
title: "Zinc default loop"
description: |
  Zinc's default assistant loop. Circuitry stores the executable topology;
  Zinc supplies the local runtime, tools, sessions, prompts, and model loop.
imports:
  - path: ./zinc-context-recovery.circuitry.yaml
    resources:
      focused_recovery: focused_recovery
      assembled_context: assembled_context
      session_dir: session_dir
entry: assistant
inputs:
  user_turn:
    type: text
    required: true
resources:
  user_turn:
    type: input
    label: "Current user turn"
    from: user_turn

  prompt_bash_guide:
    type: text
    label: "Bash Guide"
    uri: prompt:bash-guide

  prompt_circuitry_author:
    type: text
    label: "Circuitry Author"
    uri: prompt:circuitry-author

  recovered_context:
    type: run
    label: "Focused context recovery run"
    graph: ./zinc-context-recovery.circuitry.yaml
    entry: focused_recovery
    inputs:
      assembled_context: assembled_context
      user_turn: user_turn
      session_dir: session_dir

  assistant:
    type: agent
    identity: "Zinc"
    inputs: [user_turn, recovered_context, prompt_bash_guide, prompt_circuitry_author]
    tools:
      - read
      - write
      - edit
      - bash
      - run_graph
    expect:
      response: str
    instructions: |
      You are Zinc, a small local coding agent. Be direct, accurate, and natural.
      Answer in plain text after you have enough context.
      Use tools when they are fit for the task.
      Read prompts to lazily load packets of context.
      You may author Circuitry graphs and request graph runs with run_graph.
