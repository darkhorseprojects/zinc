version: 1

discord: {}
concurrency: 4
limits:
  pending_requests: 32
  frame_bytes: 1048576
  stderr_bytes: 1048576
  lifetime_ms: 600000
  rpc_bytes: 8388608
  rpc_timeout_ms: 30000
  output_messages: 32

policies:
  zinc:
    directory: "."
    entry: zinc.md
    mounts: {}
    lua_memory: 96MiB
    environment:
      HOME: HOME
      LANG: LANG
      LC_ALL: LC_ALL
      PATH: PATH
      TMPDIR: TMPDIR
      SystemRoot: SystemRoot
      TEMP: TEMP
      TMP: TMP
      USERPROFILE: USERPROFILE
    runtime:
      maximum_model_calls: 32
      maximum_output_tokens: 4096
      maximum_tool_calls: 8
      maximum_event_bytes: 1048576
      maximum_record_bytes: 8388608
      http:
        timeout_ms: 300000
        request_bytes: 8388608
        response_bytes: 16777216
      retrieval:
        chronological_records: 256
        chronological_tokens: 32768
        semantic_tokens: 32768
        semantic_terms: 512
        grounding_tokens: 4096
        exact_forms: 512
        candidates: 64

users: {}
channels: {}
guilds: {}
