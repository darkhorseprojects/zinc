version: 2

policies:
  zinc:
    source: package
    entry: zinc
    limits:
      memory_bytes: 100663296
      instructions: 200000000
    discord: true
    images: true
    options:
      - config.chat
      - config.rerank
      - config.thinking
      - config.run.tokens
      - config.run.rounds
      - config.run.tool_bytes
      - config.history.records
      - config.history.bytes
      - config.search.language
      - config.search.candidates
      - config.search.bytes
      - config.search.depth
      - config.search.terms
      - config.search.score
      - config.limits.chat.tokens
      - input.parent
      - input.through
    input:
      text: "${prompt}"
      images: "${images}"
    config:
      actor: "discord:${application}:${policy}:member:${member}:channel:${channel}"
      preset: configured
      store: "${directory}/state/zinc.db"
      cygnet: "${directory}/data/cygnet.db"
      providers:
        llama:
          url: http://127.0.0.1:8000
      chat: llama:chat
      rerank: llama:rerank
      thinking: medium
      run:
        tokens: 0
        rounds: 32
        tool_bytes: 8192
      history:
        records: 256
        bytes: 32768
      search:
        language: en
        depth: 1
        terms: 64
        candidates: 16
        bytes: 32768
        score: 0
      limits:
        chat:
          tokens: 0
          calls: 16
          source_bytes: 65536
          argument_bytes: 524288
          response_bytes: 8388608
        rerank:
          pair_bytes: 3968
          query_bytes: 2048
      tools:
        roots: {}
        actions: {}

members: {}
channels: {}
guilds: {}
