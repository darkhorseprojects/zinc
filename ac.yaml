version: 3
concurrency: 4
limits:
  pending_requests: 32
  lifetime_ms: 600000
  grant_lifetime_ms: 86400000
  rpc_bytes: 8388608
  output_messages: 32
policies:
  zinc:
    directory: /srv/agents
    source: zinc
    entry: zinc
    dependencies:
      library: zinc/jpm_tree/lib
    limits: {frameBytes: 16777216, depth: 64, inFlight: 32, handles: 4096, admissionSeconds: 10}
    spawn: [janet]
    discord: true
    images: true
    options: [config.chat, config.rerank, config.thinking, config.rounds, config.budget, input.parent, input.persist]
    imports:
      worker:
        policy: worker
        members: [execute, validate-image, validate-package]
        imports: [ledger]
        spawn: true
      ledger:
        policy: zinc
        members: [receipt]
        imports: [worker, ledger, discord]
        spawn: true
    input:
      text: "${prompt}"
      images: "${images}"
    config:
      actor: "discord:${application}:${policy}:member:${member}:channel:${channel}"
      repo: "${directory}/zinc"
      state: "${directory}/zinc/state"
      store: "${directory}/zinc/state/application-v9.db"
      world: configured
      worlds: [configured, empty, unrestricted]
      world-actions: [merge, fork, restore]
      code-actions: []
      cygnet: "${directory}/zinc/data/cygnet.db"
      stopwords: "${directory}/zinc/data/stopwords-iso.json"
      providers:
        llama: {url: "http://127.0.0.1:8000"}
      chat: llama:chat
      rerank: llama:rerank
      thinking: none
  worker:
    directory: /srv/agents
    source: zinc
    entry: src/worker.janet
    dependencies:
      library: zinc/jpm_tree/lib
    command: [bwrap, --die-with-parent, --ro-bind, /, /, --proc, /proc, --dev, /dev, --tmpfs, /tmp, --, janet]
    limits: {frameBytes: 16777216, depth: 64, inFlight: 32, handles: 4096, admissionSeconds: 10}
    config: {jailed: true, source-bytes: 65536, response-bytes: 8388608}
members: {}
channels: {}
guilds: {}
