version: 1
concurrency: 4
limits:
  pending_requests: 32
  lifetime_ms: 600000
  stop_ms: 5000
  grant_lifetime_ms: 86400000
  rpc_bytes: 8388608
  output_messages: 32
agents:
  zinc:
    directory: /srv/agents
    program:
      sourceDir: zinc
      entryModule: zinc.md
      command: [timeout, --kill-after=5s, 900s, janet]
      dependencies: &libraries
        library: zinc/jpm_tree/lib
    limits: {frameBytes: 16777216, depth: 64, inFlight: 32, handles: 4096, admissionSeconds: 10}
    spawn: [setsid, --, timeout, --kill-after=5s, 900s, janet]
    discord: true
    images: true
    options: [config.chat, config.rerank, config.thinking, config.rounds, input.parent, input.persist]
    imports:
      repl:
        program:
          sourceDir: zinc
          entryModule: src/repl.janet
          command: [timeout, --kill-after=5s, 900s, janet]
          dependencies: *libraries
        config:
          socket: "${directory}/run/zinc/${application}-${member}-${channel}/world.sock"
        members: [eval, document]
        imports: [ledger]
        spawn: true
      ledger:
        program: self
        members: [receipt]
        imports: [repl, ledger, discord]
        spawn: true
    input:
      text: "${prompt}"
      images: "${images}"
    config:
      actor: "discord:${application}:${policy}:member:${member}:channel:${channel}"
      store: "${directory}/private/zinc/application.db"
      world: "discord:${application}:${member}:${channel}"
      repl: true
      run-seconds: 900
      cygnet: "${directory}/zinc/data/cygnet.db"
      stopwords: "${directory}/zinc/data/stopwords-iso.json"
      providers:
        llama: {url: "http://127.0.0.1:8000"}
      chat: llama:chat
      rerank: llama:rerank
      thinking: none
policies:
  members: {}
  channels: {}
  guilds: {}
