circuitry: "0.6.4"
name: search web
about: Search the web through a Zinc package shape.

zinc:
  packages:
    browser: browser@0.6.1
    responses: openai-responses@0.1.8

takes:
  $query: text
  $current_date: date

uses:
  search:
    shape: browser.search-web
    takes:
      query: $query
      current_date: $current_date
    gives:
      sources: $sources

  answer:
    model: fast
    takes:
      query: $query
      sources: $sources
    does: |
      Answer from the sources with citations.
    gives:
      answer: $answer
      citations: $citations

gives:
  $answer: text
  $citations: list
