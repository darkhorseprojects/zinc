circuitry: "0.7.4"
name: search web
about: Compose package capabilities without Zinc owning their internals.

takes:
  $query: text
  $current_date: date

uses:
  search:
    shape: browser.search_web
    takes:
      query: $query
      current_date: $current_date
    gives:
      sources: $sources

  answer:
    model: fast
    takes:
      query: $query
      sources: $sources
    does: |
      Answer from the sources with citations.
    gives:
      answer: $answer
      citations: $citations

gives:
  $answer: text
  $citations: list
