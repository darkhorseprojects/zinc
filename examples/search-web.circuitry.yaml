circuitry: "0.8.0"
name: search web
about: Compose package capabilities without Zinc owning their internals.

in:
  $query: text
  $current_date: date

steps:
  search:
    file: browser.search_web
    in:
      query: $query
      current_date: $current_date
    out:
      sources: $sources

  answer:
    surface: openai-responses.responses
    model: fast
    in:
      query: $query
      sources: $sources
    text: |
      Answer from the sources with citations.
    out:
      answer: $answer
      citations: $citations

out:
  $answer: text
  $citations: list
