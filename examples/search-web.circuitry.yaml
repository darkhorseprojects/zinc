circuitry: "0.8.1"
name: search web
about: Compose package capabilities without Zinc owning their internals.

in:
  - $query
  $current_date: date

work:
  search:
    file: browser.search_web
    in:
      query: $query
      current_date: $current_date
    out:
      sources: $sources

  answer:
    surface: openai-responses.responses
    model: fast
    in:
      query: $query
      sources: $sources
      prompt: |
        Answer from the sources with citations.
    out:
      answer: $answer
      citations: $citations

out:
  - $answer
  $citations: list
