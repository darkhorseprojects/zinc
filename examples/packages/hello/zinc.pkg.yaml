name: hello
version: "0.1.0"
description: Tiny Zinc package example.
assets:
  graphs:
    hello: graphs/hello.circuitry.yaml
    hello_run: graphs/hello-run.circuitry.yaml
  prompts:
    hello_prompt: prompts/hello-style.md
  files:
    hello_asset: assets/hello.txt
scripts:
  check:
    linux: scripts/check
    macos: scripts/check
    windows: scripts/check.cmd
attach:
  target:
    kind: model
  resources:
    - hello_prompt
  input:
    - hello_prompt
  tools:
    - hello_process
tools:
  hello_process:
    label: Hello process
    description: Run the packaged hello process tool.
    prompt: run the packaged hello process tool
    input:
      name: string
    docs:
      name: Name to greet
    handler:
      process:
        command:
          linux: tools/hello-process
          macos: tools/hello-process
          windows: tools/hello-process.cmd
  hello_http:
    label: Hello HTTP
    description: Example HTTP tool definition.
    input:
      name: string
    docs:
      name: Name to greet
    handler:
      http:
        method: POST
        url: http://127.0.0.1:8787/hello
  hello_mcp:
    label: Hello MCP
    description: Example MCP tool definition.
    input:
      name: string
    docs:
      name: Name to greet
    handler:
      mcp:
        command:
          linux: tools/hello-mcp
          macos: tools/hello-mcp
          windows: tools/hello-mcp.cmd
        tool: hello
