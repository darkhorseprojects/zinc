circuitry: "0.5"
title: Hello package

exports:
  main:
    run: hello
    input:
      name: string
    returns:
      greeting: hello

resources:
  style:
    text:
      uri: prompt:hello-style

  hello:
    model:
      identity: Hello package
      instructions: Write one friendly greeting using the requested style and name.
      input: [style, $name]
      schema:
        greeting: string
