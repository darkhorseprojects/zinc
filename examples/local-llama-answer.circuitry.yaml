circuitry: "0.6.4"
name: local llama answer
about: Answer through the package-provided OpenAI Responses-shaped adapter.

zinc:
  packages:
    responses: openai-responses@0.1.8

takes:
  $question: text

uses:
  answer:
    model: local-llama
    takes:
      question: $question
    does: |
      Answer in one short sentence.
    gives:
      answer: $answer

gives:
  $answer: text
