circuitry: "0.8.0"
name: local llama answer
about: Answer through package surface.

in:
  - $question

steps:
  answer:
    surface: openai-responses.responses
    model: local-llama
    in:
      question: $question
    text: |
      Answer in one short sentence.
    out:
      answer: $answer

out:
  - $answer
