circuitry: "0.7.6"
name: local llama answer
about: Answer through package software.

takes:
  - $question

uses:
  answer:
    software: openai-responses.responses
    model: local-llama
    takes:
      question: $question
    does: |
      Answer in one short sentence.
    gives:
      answer: $answer

gives:
  - $answer
