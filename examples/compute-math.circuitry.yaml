circuitry: "0.8.0"
name: explain compound interest
about: Ask a capable model/package to explain the calculation from explicit inputs.

in:
  $principal: number
  $rate: number
  $years: number

steps:
  explanation:
    surface: openai-responses.responses
    model: local-llama
    in:
      principal: $principal
      rate: $rate
      years: $years
    text: |
      Explain the compound-interest result for these inputs. Include the formula and final amount.
    out:
      answer: $answer

out:
  $answer: text
