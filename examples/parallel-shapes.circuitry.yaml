circuitry: "0.8.1"
name: parallel shapes

in:
  - $left_question
  - $right_question
work:
  left:
    file: openai-responses.shapes.short_answer
    in:
      question: $left_question
    out:
      answer: $left_answer
  right:
    file: openai-responses.shapes.short_answer
    in:
      question: $right_question
    out:
      answer: $right_answer

out:
  - $left_answer
  - $right_answer
