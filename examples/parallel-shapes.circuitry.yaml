circuitry: "0.6.2"
name: parallel shapes

zinc:
  runtime:
    parallel: true
    max_parallel: 2
  packages:
    responses: openai-responses@0.1.5

takes:
  $left_question: text
  $right_question: text

uses:
  left:
    shape: responses.short-answer
    takes:
      question: $left_question
    gives:
      answer: $left_answer
  right:
    shape: responses.short-answer
    takes:
      question: $right_question
    gives:
      answer: $right_answer

gives:
  $left_answer: text
  $right_answer: text
