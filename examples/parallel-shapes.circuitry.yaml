circuitry: "0.7.6"
name: parallel shapes

takes:
  $left_question: text
  $right_question: text

uses:
  left:
    shape: openai-responses.shapes.short_answer
    takes:
      question: $left_question
    gives:
      answer: $left_answer
  right:
    shape: openai-responses.shapes.short_answer
    takes:
      question: $right_question
    gives:
      answer: $right_answer

gives:
  $left_answer: text
  $right_answer: text
