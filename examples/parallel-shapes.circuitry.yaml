circuitry: "0.6.1"
name: parallel shapes

zinc:
  runtime:
    parallel: true
    max_parallel: 2
  packages:
    responses: zinc://package/openai-responses@0.1.4

takes:
  $left_question:
    type: text
  $right_question:
    type: text

uses:
  left:
    shape: @responses.shapes.short-answer
    takes:
      question: $left_question
    gives:
      answer: $left_answer
  right:
    shape: @responses.shapes.short-answer
    takes:
      question: $right_question
    gives:
      answer: $right_answer

gives:
  $left_answer:
    type: text
  $right_answer:
    type: text
