circuitry: "0.8.0"
name: bash status snapshot
about: Ask the Bash package to report the current repository status.

in:
  $command: text

steps:
  status:
    surface: unix-bash.bash
    in:
      command: $command
    command: $command
    out:
      output: $output
      exit: $exit

out:
  $output: text
  $exit: text
