circuitry: "0.7.6"
name: bash status snapshot
about: Ask the Bash package to report the current repository status.

takes:
  $command: text

uses:
  status:
    software: unix-bash.bash
    takes:
      command: $command
    command: $command
    gives:
      output: $output
      exit: $exit

gives:
  $output: text
  $exit: text
