circuitry: "0.8.0"
name: parallel math

in:
  - $x

steps:
  double:
    in:
      x: $x
    text: |
      y = x * 2
    out:
      y: $double
  triple:
    in:
      x: $x
    text: |
      y = x * 3
    out:
      y: $triple
  total:
    in:
      double: $double
      triple: $triple
    text: |
      sum = double + triple
    out:
      sum: $total

out:
  - $double
  - $triple
  - $total
