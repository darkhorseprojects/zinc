circuitry: "0.6.2"
name: parallel math

zinc:
  runtime:
    parallel: true
    max_parallel: 2

takes:
  $x: number

uses:
  double:
    takes:
      x: $x
    does: |
      y = x * 2
    gives:
      y: $double
  triple:
    takes:
      x: $x
    does: |
      y = x * 3
    gives:
      y: $triple
  total:
    takes:
      double: $double
      triple: $triple
    does: |
      sum = double + triple
    gives:
      sum: $total

gives:
  $double: number
  $triple: number
  $total: number
