circuitry: "0.8.2"
name: parallel math

in:
  - $x

work:
  double:
    in:
      x: $x
      prompt: |
        y = x * 2
    out:
      y: $double
  triple:
    in:
      x: $x
      prompt: |
        y = x * 3
    out:
      y: $triple
  total:
    in:
      double: $double
      triple: $triple
      prompt: |
        sum = double + triple
    out:
      sum: $total

out:
  - $double
  - $triple
  - $total
