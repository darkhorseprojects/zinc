circuitry: "0.7.4"
name: parallel math

takes:
  - $x

uses:
  double:
    takes:
      x: $x
    does: |
      y = x * 2
    gives:
      y: $double
  triple:
    takes:
      x: $x
    does: |
      y = x * 3
    gives:
      y: $triple
  total:
    takes:
      double: $double
      triple: $triple
    does: |
      sum = double + triple
    gives:
      sum: $total

gives:
  - $double
  - $triple
  - $total
