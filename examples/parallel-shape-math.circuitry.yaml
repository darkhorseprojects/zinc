circuitry: "0.8.0"
name: parallel shape math

in:
  - $x

steps:
  double:
    file: ./parts/double.circuitry.yaml
    in:
      x: $x
    out:
      y: $double
  triple:
    file: ./parts/triple.circuitry.yaml
    in:
      x: $x
    out:
      y: $triple
  total:
    in:
      double: $double
      triple: $triple
    text: |
      sum = double + triple
    out:
      sum: $total

out:
  - $double
  - $triple
  - $total
