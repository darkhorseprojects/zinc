circuitry: "0.7.5"
name: parallel shape math

takes:
  - $x

uses:
  double:
    shape: ./parts/double.circuitry.yaml
    takes:
      x: $x
    gives:
      y: $double
  triple:
    shape: ./parts/triple.circuitry.yaml
    takes:
      x: $x
    gives:
      y: $triple
  total:
    takes:
      double: $double
      triple: $triple
    does: |
      sum = double + triple
    gives:
      sum: $total

gives:
  - $double
  - $triple
  - $total
