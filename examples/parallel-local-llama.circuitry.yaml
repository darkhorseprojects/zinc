circuitry: "0.7.5"
name: parallel local llama

takes:
  $topic: text

uses:
  define:
    model: local-llama
    takes:
      topic: $topic
    does: |
      Define the topic in one short sentence.
    gives:
      answer: $definition
  analogy:
    model: local-llama
    takes:
      topic: $topic
    does: |
      Give one short analogy for the topic.
    gives:
      answer: $analogy

gives:
  $definition: text
  $analogy: text
