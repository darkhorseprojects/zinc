circuitry: "0.8.2"
name: parallel local llama

in:
  - $topic
work:
  define:
    surface: openai-responses.responses
    model: local-llama
    in:
      topic: $topic
      prompt: |
        Define the topic in one short sentence.
    out:
      answer: $definition
  analogy:
    surface: openai-responses.responses
    model: local-llama
    in:
      topic: $topic
      prompt: |
        Give one short analogy for the topic.
    out:
      answer: $analogy

out:
  - $definition
  - $analogy
