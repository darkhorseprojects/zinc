circuitry: "0.8.0"
name: parallel local llama

in:
  $topic: text

steps:
  define:
    surface: openai-responses.responses
    model: local-llama
    in:
      topic: $topic
    text: |
      Define the topic in one short sentence.
    out:
      answer: $definition
  analogy:
    surface: openai-responses.responses
    model: local-llama
    in:
      topic: $topic
    text: |
      Give one short analogy for the topic.
    out:
      answer: $analogy

out:
  $definition: text
  $analogy: text
