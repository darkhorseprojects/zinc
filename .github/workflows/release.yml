name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            os: ubuntu-latest
            binary: zn
            asset: zn-x86_64-linux
          - target: x86_64-macos
            os: macos-15-intel
            binary: zn
            asset: zn-x86_64-macos
          - target: aarch64-macos
            os: macos-14
            binary: zn
            asset: zn-aarch64-macos
          - target: x86_64-windows-msvc
            os: windows-latest
            binary: zn.exe
            asset: zn-x86_64-windows.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Zinc
        uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test Zinc
        run: zig build test -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Build Zinc
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package binary
        run: |
          cp "zig-out/bin/${{ matrix.binary }}" "${{ matrix.asset }}"
          python - <<'PY' "${{ matrix.asset }}"
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          path.with_name(path.name + ".sha256").write_text(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Zig source package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="zn-source-${version}"
          rm -rf "$package"
          mkdir -p "$package"
          cp build.zig build.zig.zon README.md LICENSE "$package/"
          cp -R src scripts examples "$package/"
          tar -czf "${package}.tar.gz" "$package"
          python - <<'PY' "${package}.tar.gz" > "${package}.tar.gz.sha256"
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zn-source
          path: |
            zn-source-*.tar.gz
            zn-source-*.tar.gz.sha256
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - source-package
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
