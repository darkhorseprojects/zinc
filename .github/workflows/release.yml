name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            archive: zinc-linux-x86_64.tar.gz
            binary: zn
          - target: x86_64-macos
            archive: zinc-macos-x86_64.tar.gz
            binary: zn
          - target: aarch64-macos
            archive: zinc-macos-aarch64.tar.gz
            binary: zn
          - target: x86_64-windows
            archive: zinc-windows-x86_64.zip
            binary: zn.exe
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Prepare Zig cache
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR"
      - run: zig build test
      - run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
      - name: Package archive
        run: |
          package_dir="package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp "zig-out/bin/${{ matrix.binary }}" "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          cp scripts/install-unix.sh scripts/install-windows.ps1 "$package_dir/"
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            (cd "$package_dir" && zip -r "../${{ matrix.archive }}" .)
          else
            tar -czf "${{ matrix.archive }}" -C "$package_dir" .
          fi
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
