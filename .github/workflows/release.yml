name: zinc

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  LUX_VERSION: 0.42.1
  PORTABLE_AGENTS_VERSION: 1.0.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, id: linux-x86_64 }
          - { os: ubuntu-24.04-arm, id: linux-aarch64 }
          - { os: macos-13, id: macos-x86_64 }
          - { os: macos-14, id: macos-aarch64 }
          - { os: windows-latest, id: windows-x86_64 }
          - { os: windows-11-arm, id: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Install tools and Portable Agents
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cargo install lux-cli --version "$LUX_VERSION" --root "$RUNNER_TEMP/lux" --no-default-features --features vendored --locked
          echo "$RUNNER_TEMP/lux/bin" >> "$GITHUB_PATH"
          mkdir "$RUNNER_TEMP/agent"
          gh release download "v$PORTABLE_AGENTS_VERSION" -R darkhorseprojects/portable-agents -p "*-${{ matrix.id }}.*" -D "$RUNNER_TEMP/agent"
          archive=$(find "$RUNNER_TEMP/agent" -type f | head -1)
          if [[ "$archive" == *.zip ]]; then unzip -q "$archive" -d "$RUNNER_TEMP/agent"; else tar -xzf "$archive" -C "$RUNNER_TEMP/agent"; fi
          agent=$(find "$RUNNER_TEMP/agent" -type f \( -name agent -o -name agent.exe \) | head -1)
          echo "AGENT_BIN=$agent" >> "$GITHUB_ENV"
      - name: Build Zinc closure and Cygnet index
        shell: bash
        run: |
          lx --lua-version 5.5 --lua-dir "$PWD/.lux/lua" install-lua
          lx --lua-dir "$PWD/.lux/lua" --vendor-dir "$PWD/vendor/sources" --max-jobs 1 build --only-deps
          eval "$(lx path full --no-loader --no-bin)"
          curl -fsSL https://github.com/omwn/cygnet/releases/download/2026.05.12/cygnet.db.gz -o "$RUNNER_TEMP/cygnet.db.gz"
          test "$(sha256sum "$RUNNER_TEMP/cygnet.db.gz" | cut -d' ' -f1)" = 65e93f3620d7cc5444350d9e204259e961096138767d9ea73403ade38964cc48
          gzip -dc "$RUNNER_TEMP/cygnet.db.gz" > "$RUNNER_TEMP/cygnet.db"
          lua tools/cygnet_index.lua "$RUNNER_TEMP/cygnet.db" data/cygnet.db aae2cdb1418c1435558584a91181e1cb94459f2506c16f2be4b00e81428deaff
      - name: Test and package
        shell: bash
        run: |
          test "$(awk 'NF { lines++ } END { print lines }' zinc.md design.md src/*.lua src/internal/*.lua)" -lt 600
          ! grep -R -E --line-number -- '--trust|pa\.document|next_value|local source(, directory)? = \.\.\.' zinc.md design.md src tests
          lx fmt --check --path src
          lx fmt --check --path tests
          lx fmt --check --path tools
          for path in src tests tools; do lx --lua-version 5.4 lint --path "$path"; done
          lx --lua-dir "$PWD/.lux/lua" --vendor-dir "$PWD/vendor/sources" --max-jobs 1 test
          .lux/lua/bin/lua tools/benchmark.lua
          "$AGENT_BIN" check --directory . --entry zinc.md --lua-memory 96MiB
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            root="zinc-${GITHUB_REF_NAME}-${{ matrix.id }}"
            mkdir -p "$root/.lux/runtime/lua" "$root/.lux/runtime/lib"
            cp zinc.md design.md models.ini models.lock README.md LICENSE NOTICE "$root/"
            cp -R src data "$root/"
            for package in .lux/5.5/*@*; do
              [[ "$package" == *-zinc@* ]] && continue
              [[ ! -d "$package/src" ]] || cp -R "$package/src/." "$root/.lux/runtime/lua/"
              [[ ! -d "$package/lib" ]] || cp -R "$package/lib/." "$root/.lux/runtime/lib/"
            done
            if [[ "$RUNNER_OS" == Windows ]]; then ROOT="$root" pwsh -NoProfile -Command 'Compress-Archive $env:ROOT ($env:ROOT + ".zip")';
            else tar -czf "$root.tar.gz" "$root"; fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zinc-${{ matrix.id }}
          path: zinc-*.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: zinc-*, path: artifacts, merge-multiple: true }
      - run: cd artifacts && sha256sum zinc-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with: { files: "artifacts/*", generate_release_notes: true }
