name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig build -Doptimize=ReleaseFast
      - run: tar -czf zinc-linux-x86_64.tar.gz -C zig-out/bin zn
      - uses: softprops/action-gh-release@v2
        with:
          files: zinc-linux-x86_64.tar.gz
