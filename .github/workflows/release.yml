name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            os: ubuntu-latest
            archive: zinc-linux-x86_64.tar.gz
            binary: zn
            raw: zn-x86_64-linux
          - target: x86_64-macos
            os: macos-15-intel
            archive: zinc-macos-x86_64.tar.gz
            binary: zn
            raw: zn-x86_64-macos
          - target: aarch64-macos
            os: macos-14
            archive: zinc-macos-aarch64.tar.gz
            binary: zn
            raw: zn-aarch64-macos
          - target: x86_64-windows-msvc
            os: windows-latest
            archive: zinc-windows-x86_64.zip
            binary: zn.exe
            raw: zn-x86_64-windows.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Zinc
        uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test Zinc
        run: zig build test -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Build Zinc
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package archive
        run: |
          package_dir="package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp "zig-out/bin/${{ matrix.binary }}" "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          cp scripts/install-unix.sh scripts/install-windows.ps1 "$package_dir/"
          cp "zig-out/bin/${{ matrix.binary }}" "${{ matrix.raw }}"
          python - <<'PY' "$package_dir" "${{ matrix.archive }}" "${{ matrix.raw }}"
          import hashlib, pathlib, sys, tarfile, zipfile
          package_dir = pathlib.Path(sys.argv[1])
          archive = pathlib.Path(sys.argv[2])
          raw = pathlib.Path(sys.argv[3])
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
                  for path in sorted(package_dir.rglob("*")):
                      if path.is_file():
                          zf.write(path, path.relative_to(package_dir))
          else:
              with tarfile.open(archive, "w:gz") as tf:
                  for path in sorted(package_dir.rglob("*")):
                      tf.add(path, path.relative_to(package_dir))
          for path in (archive, raw):
              path.with_name(path.name + ".sha256").write_text(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            ${{ matrix.raw }}
            ${{ matrix.raw }}.sha256
          if-no-files-found: error

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Zig source package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="zinc-${version}"
          rm -rf "$package"
          mkdir -p "$package"
          cp build.zig build.zig.zon README.md LICENSE "$package/"
          cp -R src scripts examples "$package/"
          tar -czf "${package}.tar.gz" "$package"
          python - <<'PY' "${package}.tar.gz" > "${package}.tar.gz.sha256"
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zinc-source
          path: |
            zinc-*.tar.gz
            zinc-*.tar.gz.sha256
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - source-package
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
