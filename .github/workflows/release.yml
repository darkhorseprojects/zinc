name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zinc
      - uses: actions/checkout@v4
        with:
          repository: darkhorseprojects/circuitry
          ref: v0.10.0
          path: circuitry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            circuitry/package-lock.json
            zinc/package-lock.json
      - run: curl -fsSL https://edgejs.org/install | bash
      - run: echo "$HOME/.edgejs/bin" >> "$GITHUB_PATH"
      - run: npm ci && npm run verify
        working-directory: circuitry
      - run: npm ci && npm run check
        working-directory: zinc
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar --exclude='*/node_modules' --exclude='*/.git' -czf "zinc-${version}.tar.gz" zinc circuitry
          sha256sum "zinc-${version}.tar.gz" > "zinc-${version}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zinc-*.tar.gz
            zinc-*.tar.gz.sha256
