name: zinc

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: ${{ inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CFLAGS: -DSQLITE_ENABLE_FTS5

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install --yes liblua5.4-0 liblua5.5-dev lua5.5 pkgconf unzip
          mkdir -p "$RUNNER_TEMP/lux/bin" "$RUNNER_TEMP/lux/lib"
          curl -fsSL https://github.com/lumen-oss/lux/releases/download/v0.43.3/lx-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/lux/lux.tgz"
          curl -fsSL https://archive.ubuntu.com/ubuntu/pool/main/g/gpgme1.0/libgpgme11t64_1.18.0-4.1ubuntu4_amd64.deb -o "$RUNNER_TEMP/lux/gpgme.deb"
          curl -fsSL https://archive.ubuntu.com/ubuntu/pool/main/liba/libassuan/libassuan0_2.5.6-1build1_amd64.deb -o "$RUNNER_TEMP/lux/assuan.deb"
          echo '32f091c10dcfcb0e7ba990a65ebb14b92cf46a446738f5732e49cd68456ba9d2  '"$RUNNER_TEMP/lux/lux.tgz" | sha256sum -c -
          echo 'b3640068e8af3becf16faec886ff139880736ed23a7fc605c1f0cece405a5606  '"$RUNNER_TEMP/lux/gpgme.deb" | sha256sum -c -
          echo '59c6ee6aa6fffb5d181f37373baec18c26791f5d1c907ceeb62163460b11daf2  '"$RUNNER_TEMP/lux/assuan.deb" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lux/lux.tgz" -C "$RUNNER_TEMP/lux/bin"
          dpkg-deb -x "$RUNNER_TEMP/lux/gpgme.deb" "$RUNNER_TEMP/lux/lib"
          dpkg-deb -x "$RUNNER_TEMP/lux/assuan.deb" "$RUNNER_TEMP/lux/lib"
          echo "$RUNNER_TEMP/lux/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/lux/lib/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lux/5.5
          key: lux-0.43.3-lua5.5-fts5-${{ hashFiles('lux.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/cygnet.db
          key: cygnet-${{ hashFiles('models.lock', 'tools/cygnet_index.lua') }}
      - name: Verify and prepare inputs
        run: |
          set -euo pipefail
          for path in package/src tools; do lx --lua-version 5.5 fmt --backend stylua --path "$path"; done
          python3 tools/format_fences.py --check
          git diff --exit-code -- package/src tools
          lua54=$(ldconfig -p | awk '/liblua5[.]4[.]so[.]0 /{print $NF; exit}')
          for path in package/src tools; do LD_PRELOAD="$lua54" lx --lua-version 5.4 lint --path "$path" -- --no-max-line-length; done
          sh -n install.sh
          pwsh -NoProfile -Command '[void][scriptblock]::Create((Get-Content -Raw install.ps1))'
          lx --lua-version 5.5 --max-jobs 1 build --only-deps
          eval "$(lx path full --no-loader --no-bin)"
          if [ ! -f data/cygnet.db ]; then
            mkdir -p data
            curl -fsSL https://github.com/omwn/cygnet/releases/download/2026.05.12/cygnet.db.gz -o "$RUNNER_TEMP/cygnet.db.gz"
            echo '65e93f3620d7cc5444350d9e204259e961096138767d9ea73403ade38964cc48  '"$RUNNER_TEMP/cygnet.db.gz" | sha256sum -c -
            gzip -dc "$RUNNER_TEMP/cygnet.db.gz" > "$RUNNER_TEMP/cygnet.db"
            echo 'aae2cdb1418c1435558584a91181e1cb94459f2506c16f2be4b00e81428deaff  '"$RUNNER_TEMP/cygnet.db" | sha256sum -c -
            lua5.5 tools/cygnet_index.lua "$RUNNER_TEMP/cygnet.db" data/cygnet.db aae2cdb1418c1435558584a91181e1cb94459f2506c16f2be4b00e81428deaff
          fi
          python3 -c "import sqlite3; d=sqlite3.connect('file:data/cygnet.db?mode=ro',uri=True); m=dict(d.execute('select key,value from metadata')); assert m['format_version']=='2' and m['source_identity']=='aae2cdb1418c1435558584a91181e1cb94459f2506c16f2be4b00e81428deaff' and d.execute('pragma integrity_check').fetchone()==('ok',)"
          mkdir -p inputs/lunajson inputs/lsqlite3
          cp .lux/5.5/*-lunajson@*/src/lunajson/{decoder,encoder}.lua inputs/lunajson/
          curl -fsSL 'https://lua.sqlite.org/home/zip/lsqlite3_v097.zip?uuid=v0.9.7' -o "$RUNNER_TEMP/lsqlite3.zip"
          echo 'de690611e248daceebe85ffeca99899a0fbdac92b91bd7ede11dac66eb290a9a  '"$RUNNER_TEMP/lsqlite3.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lsqlite3.zip" -d "$RUNNER_TEMP/lsqlite3"
          cp "$RUNNER_TEMP/lsqlite3/lsqlite3_v097"/{lsqlite3.c,sqlite3.c,sqlite3.h} inputs/lsqlite3/
      - name: Verify tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(awk -F'"' '/^version =/{print $2; exit}' lux.toml)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zinc-build-inputs
          path: inputs
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: zinc-data
          path: data/cygnet.db
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, id: linux-x86_64 }
          - { os: ubuntu-26.04-arm, id: linux-aarch64 }
          - { os: macos-15-intel, id: macos-x86_64 }
          - { os: macos-15, id: macos-aarch64 }
          - { os: windows-latest, id: windows-x86_64, msystem: UCRT64, packages: "gcc:p binutils:p lua:p pkgconf:p", cc: gcc, objdump: objdump, machine: pei-x86-64 }
          - { os: windows-11-arm, id: windows-aarch64, msystem: CLANGARM64, packages: "clang:p llvm:p lua:p pkgconf:p", cc: clang, objdump: llvm-objdump, machine: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: zinc-build-inputs
          path: inputs
      - name: Install Unix toolchain
        if: runner.os != 'Windows'
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install --yes liblua5.5-dev pkgconf; else brew install lua pkgconf; fi
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          pacboy: ${{ matrix.packages }}
      - name: Add Windows toolchain to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = if ('${{ matrix.msystem }}' -eq 'UCRT64') { 'ucrt64' } else { 'clangarm64' }
          (Join-Path '${{ steps.msys2.outputs.msys2-location }}' "$prefix\bin") | Out-File $env:GITHUB_PATH -Append
      - name: Build native module
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
          MATRIX_CC: ${{ matrix.cc }}
          OBJDUMP: ${{ matrix.objdump }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          mkdir -p build/native
          native=build/native/lsqlite3complete.so
          case $TARGET_ID in
            linux-*)
              cc -O2 -fPIC -shared $CFLAGS '-DLSQLITE_VERSION="0.9.7"' -Dluaopen_lsqlite3=luaopen_lsqlite3complete $(pkg-config --cflags lua5.5) inputs/lsqlite3/*.c -pthread -ldl -lm $(pkg-config --libs lua5.5) -o "$native"
              readelf -d "$native" | grep -F 'Shared library: [liblua5.5.so.0]'
              ;;
            macos-*)
              cc -O2 -fPIC -bundle -undefined dynamic_lookup $CFLAGS '-DLSQLITE_VERSION="0.9.7"' -Dluaopen_lsqlite3=luaopen_lsqlite3complete $(pkg-config --cflags lua5.5) inputs/lsqlite3/*.c $(pkg-config --libs lua5.5) -o "$native"
              dependency=$(otool -L "$native" | awk '/liblua/{print $1; exit}')
              install_name_tool -change "$dependency" @rpath/liblua.5.5.dylib "$native"
              otool -L "$native" | grep -F '@rpath/liblua.5.5.dylib'
              ;;
            windows-*)
              native=build/native/lsqlite3complete.dll
              "$MATRIX_CC" -O2 -shared $CFLAGS '-DLSQLITE_VERSION="0.9.7"' -Dluaopen_lsqlite3=luaopen_lsqlite3complete $(pkg-config --cflags lua5.5) inputs/lsqlite3/*.c $(pkg-config --libs lua5.5) -Wl,--export-all-symbols -o "$native"
              "$OBJDUMP" -f "$native" | grep -Fi "$EXPECTED_MACHINE"
              "$OBJDUMP" -p "$native" | grep -Fi 'DLL Name: lua55.dll'
              ;;
          esac
      - name: Test native module through Portable Agents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p runtime/download runtime/out runtime/bin smoke/native
          if [[ $TARGET_ID = windows-* ]]; then ext=zip; exe=.exe; native=build/native/lsqlite3complete.dll; else ext=tar.gz; exe=; native=build/native/lsqlite3complete.so; fi
          archive="portable-agents-v0.1.5-$TARGET_ID.$ext"
          gh release download v0.1.5 --repo darkhorseprojects/portable-agents --pattern "$archive" --pattern SHA256SUMS --dir runtime/download
          (cd runtime/download && grep -F "  $archive" SHA256SUMS | { if command -v sha256sum >/dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi; })
          set -x
          if [ "$ext" = zip ]; then
            pwsh -NoProfile -Command "Expand-Archive '$(cygpath -w "runtime/download/$archive")' '$(cygpath -w runtime/out)'"
          else
            tar -xzf "runtime/download/$archive" -C runtime/out
          fi
          cp "$(find runtime/out -name "agent$exe")" runtime/bin/
          chmod +x runtime/bin/*
          cp "$native" smoke/native/
          cat > smoke/entry.lua <<'EOF'
          local sqlite=require("lsqlite3complete")
          return setmetatable({}, {__call=function()
           local db=assert(sqlite.open_memory())
           assert(db:exec("CREATE VIRTUAL TABLE x USING fts5(v); INSERT INTO x VALUES ('ok')")==sqlite.OK)
           local found=false
           for row in db:nrows("SELECT v FROM x WHERE x MATCH 'ok'") do assert(row.v=="ok"); found=true end
           assert(found)
           assert(db:close())
           return "ok"
          end})
          EOF
          printf '%s' '{"version":1,"emits":false,"agents":[{"sourceDir":"smoke","entryModule":"entry","limits":{}}],"imports":[],"input":"","config":""}' > request.json
          if [[ $TARGET_ID = windows-* ]]; then
            output=$(cmd.exe /d /c 'runtime\bin\agent.exe call < request.json')
          else
            output=$("runtime/bin/agent$exe" call < request.json)
          fi
          printf '%s\n' "$output"
          grep -F '"output":"b2s="' <<< "$output"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.event_name != 'pull_request'
        with:
          name: zinc-data
          path: release-data
      - name: Install and package
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          if [[ $TARGET_ID = windows-* ]]; then ext=zip; exe=.exe; native=build/native/lsqlite3complete.dll; else ext=tar.gz; exe=; native=build/native/lsqlite3complete.so; fi
          root=dist/zinc
          rm -rf "$root"
          mkdir -p "$root/package/lunajson" "$root/package/native" "$root/data" "$root/state"
          cp -R package/. "$root/package/"
          cp inputs/lunajson/*.lua "$root/package/lunajson/"
          cp "$native" "$root/package/native/"
          cp release-data/cygnet.db "$root/data/"
          cp ac.yaml install.sh install.ps1 lux.toml lux.lock models.ini models.lock README.md RELEASE_NOTES.md LICENSE NOTICE "$root/"
          chmod +x "$root/install.sh"
          ! find "$root" -type f \( -name agent -o -name agent.exe -o -name agc -o -name agc.exe -o -name lua -o -name lua.exe -o -name 'liblua*' -o -name lua55.dll \) | grep .
          destination=$RUNNER_TEMP/zinc-installed
          if [ "$ext" = zip ]; then pwsh -NoProfile -File "$root/install.ps1" -Destination "$(cygpath -w "$destination")"; else "$root/install.sh" "$destination"; fi
          cp "$destination/ac.yaml" "$RUNNER_TEMP/ac.yaml"
          cp "$destination/models.ini" "$RUNNER_TEMP/models.ini"
          printf preserved > "$destination/state/preserved"
          if [ "$ext" = zip ]; then pwsh -NoProfile -File "$root/install.ps1" -Destination "$(cygpath -w "$destination")"; else "$root/install.sh" "$destination"; fi
          cmp "$destination/ac.yaml" "$RUNNER_TEMP/ac.yaml"
          cmp "$destination/models.ini" "$RUNNER_TEMP/models.ini"
          grep -Fx preserved "$destination/state/preserved"
          "runtime/bin/agent$exe" check "$destination/package" zinc
          version=$(awk -F'"' '/^version =/{print $2; exit}' lux.toml)
          archive="zinc-v$version-$TARGET_ID"
          mv "$root" "$archive"
          if [ "$ext" = zip ]; then
            ROOT=$archive pwsh -NoProfile -Command 'Compress-Archive $env:ROOT ($env:ROOT + ".zip")'
            ROOT=$archive pwsh -NoProfile -Command 'Expand-Archive ($env:ROOT + ".zip") verify-archive'
          else
            tar -czf "$archive.tar.gz" "$archive"
            mkdir verify-archive
            tar -xzf "$archive.tar.gz" -C verify-archive
            test -x "verify-archive/$archive/install.sh"
          fi
          test -f "verify-archive/$archive/data/cygnet.db"
          test -f "verify-archive/$archive/ac.yaml"
          test "$(find "verify-archive/$archive/package/native" -maxdepth 1 -type f | wc -l)" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        with:
          name: zinc-archive-${{ matrix.id }}
          path: zinc-v*-${{ matrix.id }}.*
          if-no-files-found: error

  integration:
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: zinc-build-inputs
          path: inputs
      - run: sudo apt-get update && sudo apt-get install --yes liblua5.5-dev
      - name: Test Agent Connector policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime/ac runtime/pa runtime/bin "$RUNNER_TEMP/zinc-integration/package/lunajson"
          ac=agent-connector-v0.1.5-linux-x86_64.tar.gz
          pa=portable-agents-v0.1.5-linux-x86_64.tar.gz
          gh release download v0.1.5 --repo darkhorseprojects/agent-connector --pattern "$ac" --pattern SHA256SUMS --dir runtime/ac
          gh release download v0.1.5 --repo darkhorseprojects/portable-agents --pattern "$pa" --pattern SHA256SUMS --dir runtime/pa
          for pair in "ac:$ac" "pa:$pa"; do
            dir=${pair%%:*}
            file=${pair#*:}
            (cd "runtime/$dir" && grep -F "  $file" SHA256SUMS | sha256sum -c -)
            mkdir "runtime/$dir/out"
            tar -xzf "runtime/$dir/$file" -C "runtime/$dir/out"
          done
          cp "$(find runtime/ac/out -name agc)" "$(find runtime/pa/out -name agent)" runtime/bin/
          chmod +x runtime/bin/*
          cp -R package/. "$RUNNER_TEMP/zinc-integration/package/"
          cp inputs/lunajson/*.lua "$RUNNER_TEMP/zinc-integration/package/lunajson/"
          cp ac.yaml "$RUNNER_TEMP/zinc-integration/"
          PATH="$PWD/runtime/bin:$PATH" runtime/bin/agc check "$RUNNER_TEMP/zinc-integration"

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build, integration]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: zinc-archive-*
          path: artifacts
          merge-multiple: true
      - name: Verify release assets
        working-directory: artifacts
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version =/{print $2; exit}' ../lux.toml)
          for id in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            test -f "zinc-v${version}-${id}.tar.gz"
          done
          for id in windows-x86_64 windows-aarch64; do
            test -f "zinc-v${version}-${id}.zip"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum zinc-* > SHA256SUMS
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o release.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          if [ "$status" = 404 ]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$status" = 200
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and (.assets | length) == 7 and all(.assets[]; (.digest // "" | test("^sha256:[0-9a-f]{64}$")))' release.json
          mkdir existing
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir existing
          test "$(sha256sum existing/SHA256SUMS | cut -d' ' -f1)" = "$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .digest[7:]' release.json)"
          diff -u <(find artifacts -maxdepth 1 -type f -printf '%f\n' | sort) <(jq -r '.assets[].name' release.json | sort)
          diff -u <(sort existing/SHA256SUMS) <(jq -r '.assets[] | select(.name != "SHA256SUMS") | "\(.digest[7:])  \(.name)"' release.json | sort)
          echo 'exists=true' >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        if: steps.existing.outputs.exists != 'true'
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          overwrite_files: false
