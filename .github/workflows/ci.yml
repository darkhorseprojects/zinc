name: zinc

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CFLAGS: -DSQLITE_ENABLE_FTS5
  LUX_VERSION: 0.43.3
  PORTABLE_AGENTS_COMMIT: b27118d91bc3ffce01763d721cb8cb41562e7645

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Verify source
        shell: bash
        run: |
          cargo install lux-cli --version "$LUX_VERSION" --root "$RUNNER_TEMP/lux" --no-default-features --features vendored --locked
          echo "$RUNNER_TEMP/lux/bin" >> "$GITHUB_PATH"
          for path in package/src tools; do "$RUNNER_TEMP/lux/bin/lx" --lua-version 5.5 fmt --backend stylua --path "$path"; done
          python3 tools/format_fences.py --check
          git diff --exit-code -- package/src tools
          find package/src tools -name '*.lua' -print0 | xargs -0 "$RUNNER_TEMP/lux/bin/lx" --lua-version 5.5 lua -- -e 'assert(loadfile(arg[0])); for i = 1, #arg do assert(loadfile(arg[i])) end; os.exit()'
          for path in package/src tools; do "$RUNNER_TEMP/lux/bin/lx" --lua-version 5.4 lint --path "$path" -- --no-max-line-length; done

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, id: linux-x86_64 }
          - { os: ubuntu-24.04-arm, id: linux-aarch64 }
          - { os: macos-13, id: macos-x86_64 }
          - { os: macos-14, id: macos-aarch64 }
          - { os: windows-latest, id: windows-x86_64 }
          - { os: windows-11-arm, id: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: { version: 0.16.0 }
      - name: Install tools and Portable Agents
        shell: bash
        run: |
          cargo install lux-cli --version "$LUX_VERSION" --root "$RUNNER_TEMP/lux" --no-default-features --features vendored --locked
          echo "$RUNNER_TEMP/lux/bin" >> "$GITHUB_PATH"
          curl -fsSL https://www.lua.org/ftp/lua-5.5.0.tar.gz -o "$RUNNER_TEMP/lua.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/lua.tar.gz" | cut -d' ' -f1)" = 57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d
          tar -xzf "$RUNNER_TEMP/lua.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/lua55/lib/pkgconfig" "$RUNNER_TEMP/lua55/bin"
          sources=$(find "$RUNNER_TEMP/lua-5.5.0/src" -maxdepth 1 -name '*.c' ! -name lua.c ! -name luac.c ! -name onelua.c ! -name ltests.c -print)
          case "$RUNNER_OS" in
            Linux) zig cc -O2 -fPIC -DLUA_USE_LINUX -shared $sources -lm -ldl -Wl,-soname,liblua.so.5.5 -o "$RUNNER_TEMP/lua55/lib/liblua.so.5.5"; ln -s liblua.so.5.5 "$RUNNER_TEMP/lua55/lib/liblua5.5.so" ;;
            macOS) zig cc -O2 -fPIC -DLUA_USE_MACOSX -dynamiclib $sources -Wl,-install_name,@rpath/liblua5.5.dylib -o "$RUNNER_TEMP/lua55/lib/liblua5.5.dylib" ;;
            Windows) zig cc -O2 -DLUA_BUILD_AS_DLL -shared $sources -Wl,--out-implib,"$RUNNER_TEMP/lua55/lib/liblua5.5.dll.a" -o "$RUNNER_TEMP/lua55/bin/lua5.5.dll" ;;
          esac
          cat > "$RUNNER_TEMP/lua55/lib/pkgconfig/lua5.5.pc" <<EOF
          prefix=$RUNNER_TEMP/lua55
          libdir=\${prefix}/lib
          Name: Lua
          Description: Lua language engine
          Version: 5.5.0
          Libs: -L\${libdir} -llua5.5
          EOF
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/lua55/lib/pkgconfig" >> "$GITHUB_ENV"
          [[ "$RUNNER_OS" != Linux ]] || echo "LD_LIBRARY_PATH=$RUNNER_TEMP/lua55/lib" >> "$GITHUB_ENV"
          [[ "$RUNNER_OS" != macOS ]] || echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/lua55/lib" >> "$GITHUB_ENV"
          [[ "$RUNNER_OS" != Windows ]] || echo "$RUNNER_TEMP/lua55/bin" >> "$GITHUB_PATH"
          git clone https://github.com/darkhorseprojects/portable-agents.git "$RUNNER_TEMP/portable-agents"
          git -C "$RUNNER_TEMP/portable-agents" checkout "$PORTABLE_AGENTS_COMMIT"
          (cd "$RUNNER_TEMP/portable-agents" && PKG_CONFIG_PATH="$RUNNER_TEMP/lua55/lib/pkgconfig" zig build -Doptimize=ReleaseSafe -Dsystem-lua=true --search-prefix "$RUNNER_TEMP/lua55")
          agent=$(find "$RUNNER_TEMP/portable-agents/zig-out/bin" -type f \( -name agent -o -name agent.exe \) | head -1)
          echo "AGENT_BIN=$agent" >> "$GITHUB_ENV"
      - name: Build runtime closure
        shell: bash
        run: |
          lx --lua-version 5.5 --lua-dir "$PWD/.lux/lua" install-lua
          lx --lua-dir "$PWD/.lux/lua" --max-jobs 1 build --only-deps
          eval "$(lx path full --no-loader --no-bin)"
          curl -fsSL https://github.com/omwn/cygnet/releases/download/2026.05.12/cygnet.db.gz -o "$RUNNER_TEMP/cygnet.db.gz"
          test "$(sha256sum "$RUNNER_TEMP/cygnet.db.gz" | cut -d' ' -f1)" = 65e93f3620d7cc5444350d9e204259e961096138767d9ea73403ade38964cc48
          gzip -dc "$RUNNER_TEMP/cygnet.db.gz" > "$RUNNER_TEMP/cygnet.db"
          lua tools/cygnet_index.lua "$RUNNER_TEMP/cygnet.db" data/cygnet.db aae2cdb1418c1435558584a91181e1cb94459f2506c16f2be4b00e81428deaff
      - name: Package
        shell: bash
        run: |
          root=dist/zinc
          rm -rf "$root"
          mkdir -p "$root/package/lunajson" "$root/package/native" "$root/data" "$root/state"
          cp -R package/. "$root/package/"
          cp ac.yaml models.ini models.lock README.md LICENSE NOTICE "$root/"
          cp data/cygnet.db "$root/data/"
          shopt -s nullglob
          decoders=(.lux/5.5/*-lunajson@*/src/lunajson/decoder.lua)
          encoders=(.lux/5.5/*-lunajson@*/src/lunajson/encoder.lua)
          libraries=(.lux/5.5/*-lsqlite3complete@*/lib/lsqlite3complete.{so,dll})
          test "${#decoders[@]}" -eq 1
          test "${#encoders[@]}" -eq 1
          test "${#libraries[@]}" -eq 1
          cp "${decoders[0]}" "${encoders[0]}" "$root/package/lunajson/"
          cp "${libraries[0]}" "$root/package/native/"
          "$AGENT_BIN" check "$root/package" zinc
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            archive="zinc-${GITHUB_REF_NAME}-${{ matrix.id }}"
            mv "$root" "$archive"
            if [[ "$RUNNER_OS" == Windows ]]; then ROOT="$archive" pwsh -NoProfile -Command 'Compress-Archive $env:ROOT ($env:ROOT + ".zip")';
            else tar -czf "$archive.tar.gz" "$archive"; fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zinc-${{ matrix.id }}
          path: zinc-*.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: zinc-*, path: artifacts, merge-multiple: true }
      - run: cd artifacts && sha256sum zinc-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with: { files: "artifacts/*", generate_release_notes: true }
