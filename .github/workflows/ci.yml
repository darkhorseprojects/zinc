name: CI
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: zinc, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: janet-lang/janet
          ref: e1963cdfe0148f83601907727e00bd672d798115
          path: janet
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: janet-lang/jpm
          ref: 029d0c4cfefd2d359ddc5344eae61a1771f4e673
          path: jpm
          persist-credentials: false
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libsqlite3-dev
          prefix="$RUNNER_TEMP/janet"
          make -C janet -j2 PREFIX="$prefix"
          make -C janet install PREFIX="$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "JANET_HEADERPATH=$prefix/include/janet" >> "$GITHUB_ENV"
          echo "JANET_LIBPATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "JANET_BINPATH=$prefix/bin" >> "$GITHUB_ENV"
          echo "JANET_MODPATH=$prefix/lib/janet" >> "$GITHUB_ENV"
          echo "JANET_PATH=$prefix/lib/janet" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Install pinned Jpm
        working-directory: jpm
        run: janet bootstrap.janet
      - name: Build pinned dependencies and package
        working-directory: zinc
        run: |
          JANET_SYSTEM_SQLITE=1 jpm --local deps
          jpm --local install
      - name: Compile Janet and SQLite
        working-directory: zinc
        run: |
          JANET_PATH="$PWD/jpm_tree/lib" janet -e '
            (put root-env (quote pa/emit) @{:value (fn [bytes]) :private true})
            (setdyn :library (dyn *syspath*))
            ((module/value (require "portable-agents/src/markdown") (quote load)) (string (os/cwd) "/zinc.md") [])
            (import ./src/schema)
            (import sqlite3 :as sql)
            (def db (sql/open ":memory:"))
            (sql/eval db schema/database)
            (sql/eval db "PRAGMA trusted_schema=OFF")
            (each view ["memory_records" "search_records" "invalid_summaries"]
              (sql/eval db (string "EXPLAIN SELECT * FROM " view " LIMIT 0")))
            (sql/eval db "EXPLAIN INSERT INTO events(source,kind,author,at,text,data,estimate) VALUES(?,?,?,?,?,?,?)" [nil nil nil nil nil nil nil])
            (sql/close db)'
