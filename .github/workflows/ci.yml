name: CI
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install native tools
        run: pacman -Syu --noconfirm janet jpm git python sqlite curl deno
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: zinc, persist-credentials: false }
      - name: Read PA revision
        id: revision
        run: |
          python - <<'PY'
          import os, pathlib, re
          revision = re.search(r'portable-agents.git" :tag "([0-9a-f]{40})"', pathlib.Path('zinc/project.janet').read_text())[1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('pa=' + revision + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: ${{ steps.revision.outputs.pa }}
          path: portable-agents
          persist-credentials: false
      - name: Build native boundary and dependencies
        run: |
          cd portable-agents
          deno task check
          deno task compile
          python tests/runtime.py
          cd ../zinc
          jpm --local deps
          jpm --local install
          cd ../portable-agents
          jpm --modpath="$GITHUB_WORKSPACE/zinc/jpm_tree/lib" install
      - name: Probe independent execution and authority
        run: python zinc/tests/runtime.py
