name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: zinc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  toolchain:
    uses: darkhorseprojects/portable-agents/.github/workflows/ci.yml@63a6d52583abea43d5473ff8a84c5e07ad9d4119
    with: { toolchain: "63a6d52583abea43d5473ff8a84c5e07ad9d4119" }
  build:
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, id: linux-x86_64 }
          - { os: ubuntu-24.04-arm, id: linux-aarch64 }
          - { os: macos-15-intel, id: macos-x86_64 }
          - { os: macos-15, id: macos-aarch64 }
          - { os: windows-latest, id: windows-x86_64 }
          - { os: windows-11-arm, id: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env: { JANET_SYSTEM_SQLITE: "0" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: zinc, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {
          name: "janet-toolchain-${{ matrix.id }}",
          path: "${{ runner.temp }}",
        }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with: { arch: "${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}" }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.13" }
      - name: Activate toolchain
        shell: python
        run: |
          import os, pathlib, tarfile
          destination = pathlib.Path.cwd() if os.name == "nt" else pathlib.Path(os.environ["RUNNER_TEMP"])
          with tarfile.open(pathlib.Path(os.environ["RUNNER_TEMP"]) / "toolchain.tar") as archive:
              archive.extractall(destination, filter="data")
          prefix = destination / "janet"
          previous = dict(line.split("=", 1) for line in (prefix / "environment").read_text().splitlines())
          windows = os.name == "nt"
          modules = prefix / ("lib" if windows else "lib/janet")
          for script in [prefix / "bin/jpm", prefix / "bin/jpm.bat", modules / "jpm/default-config.janet"]:
              if script.exists():
                  source = script.read_text(encoding="utf-8").replace(previous["PREFIX"].replace("\\", "\\\\"), str(prefix).replace("\\", "\\\\"))
                  script.write_text(source.replace(previous["PREFIX"], str(prefix)), encoding="utf-8")
          library = prefix / "build" if windows else prefix / "lib"
          env = {"PREFIX": prefix, "JANET_HEADERPATH": prefix / "build" if windows else prefix / "include/janet",
              "JANET_LIBPATH": library, "JANET_BINPATH": prefix / "bin", "JANET_MODPATH": modules, "JANET_PATH": modules,
              "LD_LIBRARY_PATH": library, "DYLD_LIBRARY_PATH": library}
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("".join(f"{key}={value}\n" for key, value in env.items()))
          with open(os.environ["GITHUB_PATH"], "a") as output:
              if windows: output.write(f"{prefix}\n")
              output.write(f"{prefix / 'bin'}\n")
      - name: Provision libcurl
        shell: python
        run: |
          import os, pathlib, platform, subprocess
          if platform.system() == "Linux":
              subprocess.run(["sudo", "apt-get", "update"], check=True)
              subprocess.run(["sudo", "apt-get", "install", "-y", "pkg-config", "libcurl4-openssl-dev"], check=True)
          elif platform.system() == "Darwin":
              subprocess.run(["brew", "install", "pkgconf", "curl"], check=True)
              prefix = subprocess.check_output(["brew", "--prefix", "curl"], text=True).strip()
              with open(os.environ["GITHUB_ENV"], "a") as output: output.write(f"PKG_CONFIG_PATH={prefix}/lib/pkgconfig\n")
          else:
              root = pathlib.Path(os.environ["VCPKG_INSTALLATION_ROOT"])
              triplet = "arm64-windows" if platform.machine().upper() == "ARM64" else "x64-windows"
              subprocess.run([str(root / "vcpkg.exe"), "install", f"curl[core,schannel]:{triplet}"], check=True)
              prefix = root / "installed" / triplet
              with open(os.environ["GITHUB_ENV"], "a") as output: output.write(f"CURL_ROOT={prefix}\n")
              with open(os.environ["GITHUB_PATH"], "a") as output: output.write(f"{prefix / 'bin'}\n")
      - name: Install Zinc
        working-directory: zinc
        shell: python
        run: |
          import os, pathlib, subprocess
          flags = "/nologo,/MD,/DSQLITE_ENABLE_FTS5" if os.name == "nt" else "-std=c99,-DSQLITE_ENABLE_FTS5"
          subprocess.run(["jpm", f"--cflags={flags}", "deps"], check=True)
          subprocess.run(["jpm", "install"], check=True)
          for source in pathlib.Path("src").glob("*.janet"):
              subprocess.run(["janet", "-k", str(source)], check=True)
      - name: Package runtime
        working-directory: zinc
        run: |
          jpm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zinc-${{ matrix.id }}
          path: zinc/dist/zinc-v*-${{ matrix.id }}.*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: zinc-*, path: artifacts, merge-multiple: true }
      - name: Check release assets
        run: |
          cd artifacts
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          for target in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-aarch64; do
            test "$(find . -name "zinc-v*-$target.*" | wc -l)" -eq 1
          done
          sha256sum zinc-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with: {
          files: "artifacts/*",
          body_path: RELEASE_NOTES.md,
          overwrite_files: false,
        }
