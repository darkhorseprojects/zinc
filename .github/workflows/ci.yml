name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    env:
      CONNECTOR_REVISION: 123ca2a5efad6b4b224374fd58c1f64b12a6cb1a
    steps:
      - name: Install native tools
        run: pacman -Syu --noconfirm janet jpm deno git python sqlite curl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: zinc
          persist-credentials: false
      - name: Read PA revision
        id: revision
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('zinc/project.janet').read_text()
          revision = re.search(r'portable-agents.git" :tag "([0-9a-f]{40})"', source)[1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('pa=' + revision + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: ${{ steps.revision.outputs.pa }}
          path: portable-agents
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/agent-connector
          ref: ${{ env.CONNECTOR_REVISION }}
          path: agent-connector
          persist-credentials: false
      - name: Install checked-out runtime
        run: |
          cd portable-agents
          jpm --local install
          echo "$PWD/jpm_tree/bin" >> "$GITHUB_PATH"
          cd ../zinc
          jpm deps
          jpm --local install
          echo "$PWD/jpm_tree/bin" >> "$GITHUB_PATH"
      - name: Check sources and build Connector
        run: |
          cd portable-agents
          deno task check
          cd ../agent-connector
          deno task check
          deno task compile
          test "$(dist/agc --version)" = "$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
      - name: Probe completion, deadlines and cleanup
        run: |
          python3 - <<'PY'
          import base64, ctypes, json, os, pathlib, shutil, signal, sqlite3, subprocess, time
          assert ctypes.CDLL(None).prctl(36, 1, 0, 0, 0) == 0
          workspace = pathlib.Path.cwd()
          zinc = workspace / 'zinc'
          pa = workspace / 'portable-agents/src/main.janet'
          library = zinc / 'jpm_tree/lib'
          scratch = workspace / '.lifetime-probe'
          scratch.mkdir()
          limits = {'frameBytes': 1048576, 'depth': 32, 'inFlight': 8, 'handles': 32, 'admissionSeconds': 1}
          command = ['janet', str(pa), 'call', *map(str, limits.values())]
          program = {'sourceDir': str(zinc), 'entryModule': 'zinc.md', 'dependencies': {'library': str(library)}}
          config = {'actor': 'probe', 'world': 'probe', 'store': str(scratch / 'history.db'), 'search': False,
                    'repl': True, 'imports': {'repl': ['eval', 'document'], 'ledger': ['receipt']},
                    'lease-seconds': 3, 'parallel': 1, 'run-seconds': 10}
          private = base64.b64encode(json.dumps(config).encode()).decode()
          grants = [
              {'name': 'repl', 'program': {**program, 'entryModule': 'src/repl.janet'},
               'config': base64.b64encode(json.dumps({'socket': str(scratch / 'world.sock')}).encode()).decode(),
               'members': ['eval', 'document'], 'imports': ['ledger'], 'spawn': True},
              {'name': 'ledger', 'program': program, 'config': private, 'members': ['receipt'],
               'imports': ['repl', 'ledger'], 'spawn': True},
          ]
          packet = {'version': 1, 'program': program, 'config': private, 'imports': grants,
                    'spawn': ['setsid', '--', 'timeout', '--kill-after=0.2s', '10s', 'janet']}
          server = None
          try:
              (scratch / 'agent').write_text('#!/bin/sh\nexec janet ' + str(pa) + ' "$@"\n')
              (scratch / 'agent').chmod(0o755)
              (scratch / 'deployment').mkdir()
              deployment = {'version': 1, 'limits': {'stop_ms': 200, 'grant_lifetime_ms': 10000},
                            'agents': {'zinc': {'program': program, 'limits': limits, 'config': {}, 'input': {'text': '${prompt}'}}},
                            'policies': {}}
              (scratch / 'deployment/ac.yaml').write_text(json.dumps(deployment))
              env = {**os.environ, 'PATH': str(scratch) + ':' + os.environ['PATH']}
              subprocess.run([str(workspace / 'agent-connector/dist/agc'), 'check', str(scratch / 'deployment')],
                             env=env, check=True, timeout=5)
              (scratch / 'probe.janet').write_text('''(defn child [input config]
                (if (= input "loop") (while true) (ev/sleep 0.3))
                (spit config "committed") (pa/emit "unobserved") "done")
              (defn call [input config]
                (def h (pa/spawn "self" (if (= input "loop") "loop" "slow") config :member "child"))
                (pa/emit "admitted")
                (case input "await" (string (pa/await h) ":" (pa/await h)) "death" (do (ev/sleep 5) "observer") "returned"))
              ''')
              for mode in ['ignore', 'await', 'death', 'loop', 'admission']:
                  target = {'sourceDir': str(scratch), 'entryModule': 'probe.janet'}
                  if mode == 'admission': target['command'] = ['sh', '-c', 'sleep 3', '--']
                  request = {'version': 1, 'program': target, 'input': base64.b64encode(mode.encode()).decode(),
                             'config': base64.b64encode(str(scratch / mode).encode()).decode(),
                             'spawn': ['setsid', '--', 'timeout', '--kill-after=0.2s', '2s', 'janet']}
                  started = time.monotonic()
                  child = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, start_new_session=True)
                  child.stdin.write((json.dumps(request) + '\n').encode()); child.stdin.close()
                  while True:
                      frame = json.loads(child.stdout.readline())
                      if mode == 'death' and frame['type'] == 'emit':
                          os.killpg(child.pid, signal.SIGKILL)
                          break
                      if frame['type'] in ['result', 'error']: break
                  child.wait(timeout=1)
                  child.stdout.close()
                  if mode == 'death': assert child.returncode == -signal.SIGKILL
                  else:
                      assert child.returncode == 0
                      assert frame['type'] == ('error' if mode == 'admission' else 'result'), frame
                      if mode == 'await': assert base64.b64decode(frame['output']) == b'done:done'
                      else: assert time.monotonic() - started < 2
                  if mode in ['ignore', 'await', 'death']:
                      until = time.monotonic() + 2
                      while not (scratch / mode).exists() and time.monotonic() < until: time.sleep(0.02)
                      assert (scratch / mode).read_text() == 'committed'
                  print('PA:', mode, 'passed', flush=True)
              (scratch / 'world.janet').write_text('(def instructions "probe")\n')
              server_config = {'file': str(scratch / 'world.janet'), 'socket': str(scratch / 'world.sock'),
                               'seconds': 2, 'forbid': ['exit', 'threads', 'signal', 'subprocess']}
              code = '(module/add-syspath ' + json.dumps(str(library)) + ') (def repl (require ' + json.dumps(str(zinc / 'src/repl.janet')) + ')) '
              code += '(with-dyns [:pa/limits {' + ' '.join(json.dumps(k) + ' ' + str(v) for k, v in limits.items()) + '}] '
              code += '((module/value repl \'serve) "" ' + json.dumps(json.dumps(server_config)) + '))'
              server = subprocess.Popen(['janet', '-e', code], start_new_session=True)
              until = time.monotonic() + 3
              while not (scratch / 'world.sock').exists() and time.monotonic() < until: time.sleep(0.02)
              assert server.poll() is None and (scratch / 'world.sock').exists()
              for name, source in [('nested', '(await (self/member "memory/document" "descendant"))'),
                                   ('death', '(ev/sleep 0.3) (+ 20 22)'), ('expired', '(while true)')]:
                  current = {**config, 'run-seconds': 1 if name == 'expired' else 10}
                  opaque = base64.b64encode(json.dumps(current).encode()).decode()
                  imports = [grants[0], {**grants[1], 'config': opaque}]
                  value = {'request': name, 'code': source}
                  request = {**packet, 'config': opaque, 'imports': imports, 'member': 'invoke',
                             'input': base64.b64encode(json.dumps(value).encode()).decode()}
                  child = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, start_new_session=True)
                  child.stdin.write((json.dumps(request) + '\n').encode()); child.stdin.close()
                  if name == 'death':
                      until = time.monotonic() + 3
                      while time.monotonic() < until:
                          with sqlite3.connect(scratch / 'history.db') as db:
                              running = db.execute("SELECT count(*) FROM tasks t JOIN runs r ON r.id=t.run WHERE r.request=? AND t.state='running'", (name,)).fetchone()[0]
                          if running: break
                          time.sleep(0.02)
                      assert running
                      os.killpg(child.pid, signal.SIGKILL)
                  child.wait(timeout=5)
                  frames = [json.loads(line) for line in child.stdout]; child.stdout.close()
                  with sqlite3.connect(scratch / 'history.db') as db:
                      rows = db.execute('SELECT t.id,t.state,t.attempt,t.result FROM tasks t JOIN runs r ON r.id=t.run WHERE r.request=? ORDER BY t.id', (name,)).fetchall()
                  if name == 'nested':
                      assert len(rows) == 2 and all(row[1] == 'done' for row in rows), rows
                      assert frames[-1]['type'] == 'result', frames
                  elif name == 'death':
                      until = time.monotonic() + 3
                      while time.monotonic() < until:
                          with sqlite3.connect(scratch / 'history.db') as db:
                              row = db.execute('SELECT t.state,t.result FROM tasks t JOIN runs r ON r.id=t.run WHERE r.request=?', (name,)).fetchone()
                          if row[0] == 'done': break
                          time.sleep(0.02)
                      assert row[0] == 'done' and json.loads(row[1])['value'] == '42', row
                  else:
                      assert len(rows) == 1 and rows[0][1:3] == ('uncertain', 1), rows
                      assert frames[-1]['type'] == 'error', frames
                      with sqlite3.connect(scratch / 'history.db') as db:
                          task, owner, generation, data, expires = db.execute("SELECT t.id,l.owner,l.generation,t.input,r.expires FROM tasks t JOIN runs r ON r.id=t.run JOIN leases l ON l.task=t.id WHERE r.request=?", (name,)).fetchone()
                      renewal = {'task': task, 'owner': owner, 'generation': generation, 'token': json.loads(data)['token'], 'operation': 'renew'}
                      for member, payload in [('receipt', renewal), ('invoke', value), ('pending', '')]:
                          follow = {**request, 'member': member, 'input': '' if payload == '' else base64.b64encode(json.dumps(payload).encode()).decode()}
                          result = subprocess.run(command, input=(json.dumps(follow) + '\n').encode(), capture_output=True, timeout=3)
                          terminal = json.loads(result.stdout.splitlines()[-1])
                          assert terminal['type'] == ('result' if member == 'pending' else 'error'), terminal
                          if member == 'pending':
                              jobs = json.loads(base64.b64decode(terminal['output']))
                              job = next(job for job in jobs if job['request'] == name)
                              assert job['state'] == 'uncertain' and job['attempt'] == 1 and job['run_expires'] == expires, job
                      with sqlite3.connect(scratch / 'history.db') as db:
                          assert db.execute('SELECT count(*) FROM tasks t JOIN runs r ON r.id=t.run WHERE r.request=?', (name,)).fetchone()[0] == 1
                  print('Zinc:', name, 'passed', flush=True)
              server.wait(timeout=3)
              assert server.returncode == 124
              (scratch / 'world.sock').unlink()
              (scratch / 'world.janet').write_text('(while true)\n')
              server = subprocess.Popen(['janet', '-e', code], start_new_session=True)
              server.wait(timeout=4)
              assert server.returncode == 124
              with sqlite3.connect(scratch / 'history.db') as db:
                  db.execute("INSERT INTO tasks(actor,run,branch,world,kind,input,scope,retry_policy,retries) SELECT actor,run,branch,world,kind,input,scope,retry_policy,retries FROM tasks WHERE id=?", (task,))
                  queued = db.execute('SELECT max(id) FROM tasks').fetchone()[0]
              recovery = {**packet, 'member': 'pending', 'input': ''}
              result = subprocess.run(command, input=(json.dumps(recovery) + '\n').encode(), capture_output=True, timeout=3)
              assert json.loads(result.stdout.splitlines()[-1])['type'] == 'result'
              with sqlite3.connect(scratch / 'history.db') as db:
                  assert db.execute('SELECT state FROM tasks WHERE id=?', (queued,)).fetchone()[0] == 'cancelled'
                  assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              print('Zinc: bootstrap watchdog, queued expiry and database integrity passed', flush=True)
          finally:
              for _ in range(30):
                  children = []
                  for proc in pathlib.Path('/proc').glob('[0-9]*'):
                      try:
                          stat = (proc / 'stat').read_text().rsplit(')', 1)[1].split()
                          if int(stat[1]) == os.getpid(): children.append(int(proc.name))
                      except (OSError, ValueError): pass
                  for pid in children:
                      try: os.kill(pid, signal.SIGKILL)
                      except ProcessLookupError: pass
                  time.sleep(0.02)
                  while True:
                      try:
                          if os.waitpid(-1, os.WNOHANG)[0] == 0: break
                      except ChildProcessError: break
                  if not children: break
              shutil.rmtree(scratch)
              assert not children, children
          PY
      - name: Clean owned fixture processes and files
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, signal
          for proc in pathlib.Path('/proc').glob('[0-9]*'):
              try:
                  if (proc / 'comm').read_text().strip() == 'janet':
                      os.kill(int(proc.name), signal.SIGKILL)
              except (OSError, ValueError): pass
          for path in ['.lifetime-probe', 'agent-connector/dist']:
              if pathlib.Path(path).exists(): shutil.rmtree(path)
          PY
