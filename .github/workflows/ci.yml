name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: zinc
      - uses: actions/checkout@v4
        with:
          repository: darkhorseprojects/portable-agents
          path: portable-agents
      - uses: actions/checkout@v4
        with:
          repository: janet-lang/janet
          ref: e1963cdfe0148f83601907727e00bd672d798115
          path: janet
      - uses: actions/checkout@v4
        with:
          repository: janet-lang/jpm
          ref: 029d0c4cfefd2d359ddc5344eae61a1771f4e673
          path: jpm
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make -C janet -j2 && sudo make -C janet install
      - run: sudo janet bootstrap.janet
        working-directory: jpm
      - run: |
          export JANET_MODPATH="$HOME/.local/lib/janet"
          export JANET_BINPATH="$HOME/.local/bin"
          export JANET_MANPATH="$HOME/.local/share/man"
          export JANET_PATH="$JANET_MODPATH"
          install -d "$JANET_MODPATH" "$JANET_BINPATH" "$JANET_MANPATH"
          (
            cd ../portable-agents
            jpm deps
            jpm install
          )
          install -d -m 700 "$HOME/.agents"
          git worktree add --detach "$HOME/.agents/zinc" HEAD
          cd "$HOME/.agents/zinc"
          jpm setup
          jpm init
          cd "$HOME"
          janet -e "(import $HOME/.agents/zinc/src/main.janet)"
        working-directory: zinc
