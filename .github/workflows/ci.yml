name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: zinc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolchain:
    uses: darkhorseprojects/portable-agents/.github/workflows/ci.yml@118795dffceb373d6157db08aa72471ebc50a08d
    with: { toolchain: "118795dffceb373d6157db08aa72471ebc50a08d" }
  verify:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: zinc, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: janet-toolchain, path: "${{ runner.temp }}" }
      - name: Activate toolchain
        run: |
          tar -xf "$RUNNER_TEMP/toolchain.tar" -C "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/janet/environment" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/janet/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y pkg-config libcurl4-openssl-dev libsqlite3-dev
      - name: Install package
        working-directory: zinc
        run: |
          JANET_SYSTEM_SQLITE=1 jpm deps
          jpm install
      - name: Check package sources
        working-directory: zinc
        run: |
          janet -e '
            (put root-env (quote pa/emit) @{:value (fn [bytes]) :private true})
            (setdyn :library (dyn *syspath*))
            ((module/value (require "portable-agents/src/markdown") (quote load)) (string (os/cwd) "/zinc.md") [])'
