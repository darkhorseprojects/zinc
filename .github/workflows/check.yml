name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: zinc
      - uses: actions/checkout@v6
        with:
          repository: darkhorseprojects/circuitry
          path: circuitry
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: deno task check
        working-directory: zinc
      - run: git diff --exit-code -- deno.lock
        working-directory: zinc
