name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: zinc
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: v1.0.0
          path: portable-agents
          persist-credentials: false
      - uses: luau-project/setup-lua@c47c002fc60841a11b22ef3058c86a3d08acf218
        with:
          lua-version: 5.5.0
          luarocks-version: 3.12.2
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev
      - if: runner.os == 'macOS'
        run: brew install curl sqlite3
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows sqlite3:x64-windows
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH
      - name: Install LuaSQLite3 from verified source
        working-directory: zinc
        run: python tools/install_lsqlite3.py
      - name: Install locked Lua modules
        working-directory: zinc
        run: luarocks --lua-version=5.5 make --only-deps zinc-dev-1.0-1.rockspec
      - run: cargo install stylua --version 2.5.2 --locked
      - run: python -m pip install pytest==9.0.3
      - working-directory: portable-agents
        run: cargo build --locked
      - working-directory: zinc
        env:
          AGENT: ${{ github.workspace }}/portable-agents/target/debug/agent${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tools/check.py
