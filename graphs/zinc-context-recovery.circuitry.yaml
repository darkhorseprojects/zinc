circuitry: "0.2.99"
title: "Zinc context recovery"
description: |
  Graph fragment for the model-guided part of continuation context recovery.
  The runtime assembles exact current-session transcript windows deterministically;
  this agent may use tools to inspect the session archive and choose extra facts.
resources:
  assembled_context:
    type: text
    label: "Deterministically assembled current-session context"
    value: ""

  user_turn:
    type: text
    label: "Current user turn supplied by parent graph"
    value: ""

  session_dir:
    type: text
    label: "Directory containing Zinc JSONL session files"
    value: ""

  focused_recovery:
    type: agent
    identity: "Focused context recovery"
    inputs: [assembled_context, user_turn, session_dir]
    tools:
      - read
      - bash
    expect:
      relevant_context:
        type: list
        items: str
    instructions: |
      Use the supplied assembled_context and user_turn to decide whether older
      Zinc sessions might contain relevant facts. If useful, inspect session_dir
      with the available tools. Prefer narrow read-only shell commands such as
      listing session files or grepping distinctive terms.

      Do not answer the user. Do not summarize the raw current session log.
      Return only extra context worth showing the main assistant; if nothing is
      useful, return an empty list.

      Output ONLY valid JSON matching: {"relevant_context": [str]}.
