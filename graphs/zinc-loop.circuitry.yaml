circuitry: "0.2.99"
title: "Zinc default loop"
description: |
  A minimal linked Circuitry agent loop. Runtime overlays provide the current
  user turn. Zinc assembles prior context deterministically, while the linked
  context recovery fragment guides focused archive searches.
links:
  - ./zinc-context-recovery.circuitry.yaml
runtime:
  provider: zinc
  model: gemma-heretic
validation:
  rules:
    - no-self-loops
    - no-unknown-edge-endpoints
    - no-cycles
    - rule: require-executable-inputs
      executableKinds: [agent]
resources:
  prompt_bash_guide:
    type: text
    label: "Bash Guide"
    value: |
      ---
      id: bash-guide
      title: Bash Guide
      description: General computer-use guide for bash: inspect files, processes, network, HTTP, git, packages, logs, and surprising command results.
      ---
      prompt:bash-guide

  assistant:
    type: agent
    identity: "Zinc"
    inputs: [assembled_context, focused_recovery, user_turn]
    tools:
      - read
      - write
      - edit
      - bash
      - request_circuitry_run
    expect:
      response: str
    instructions: |
      You are Zinc, a small local coding agent. Be direct and natural.
