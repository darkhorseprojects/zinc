circuitry: "0.5"
title: Zinc session history compaction
description: Compacts bounded Zinc session excerpts into durable memory.

exports:
  main:
    run: compaction
    input:
      session_head: string
      existing_compaction: string
      messages_to_compact: string
      retained_tail: string
    returns:
      summary: compaction.summary

resources:
  compaction:
    model:
      identity: Context compaction
      input:
        - $session_head
        - $existing_compaction
        - $messages_to_compact
        - $retained_tail
      tools: []
      instructions: |
        Compact the supplied bounded Zinc session context into durable memory.

        Preserve goals, constraints, corrections, decisions, important files,
        commands, errors, test results, unresolved questions, and current task
        state. Drop chit-chat, duplicate boilerplate, exact wording unless it
        matters, and huge tool bodies.

        Do not answer the user. Do not add advice.
        Output ONLY valid JSON matching: {"summary": string}.
      schema:
        summary: string
