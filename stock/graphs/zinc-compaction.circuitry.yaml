circuitry: "0.4"
title: "Zinc context compaction"
description: |
  Compacts bounded Zinc session excerpts into durable memory.
entry: compaction
resources:
  compact_context:
    type: text
    label: "Bounded session context for compaction"
    uri: session:compact-context

  compaction:
    type: agent
    identity: "Context compaction"
    inputs: [compact_context]
    tools: []
    output:
      summary: str
    instructions: |
      Compact the supplied bounded Zinc session context into durable memory.

      Preserve goals, constraints, corrections, decisions, important files,
      commands, errors, test results, unresolved questions, and current task
      state. Drop chit-chat, duplicate boilerplate, exact wording unless it
      matters, and huge tool bodies.

      Do not answer the user. Do not add advice.
      Output ONLY valid JSON matching: {"summary": str}.
