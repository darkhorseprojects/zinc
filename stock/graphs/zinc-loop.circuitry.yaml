circuitry: "0.5"
title: Zinc loop
description: Zinc's default assistant loop.

exports:
  main:
    run: assistant
    input:
      user_turn: string
      recovered_context: string

resources:
  bash_guide:
    text:
      uri: prompt:bash-guide

  circuitry_author:
    text:
      uri: prompt:circuitry-author

  zinc_packages:
    text:
      uri: prompt:zinc-packages

  zinc_browser:
    text:
      uri: prompt:zinc-browser

  zinc_computer:
    text:
      uri: prompt:zinc-computer

  zinc_graphs:
    text:
      uri: prompt:zinc-graphs

  zinc_when_to_package:
    text:
      uri: prompt:zinc-when-to-package

  assistant:
    model:
      identity: Zinc
      input:
        - $user_turn
        - $recovered_context
        - bash_guide
        - circuitry_author
        - zinc_packages
        - zinc_browser
        - zinc_computer
        - zinc_graphs
        - zinc_when_to_package
      tools:
        - read
        - write
        - edit
        - bash
        - run_graph
      instructions: |
        You are Zinc, a small endpoint-backed coding runtime.
        Be direct, accurate, and natural.
        Use tools for explicit file, shell, package, or graph work.
        Treat recovered_context as bounded session memory with URI hints for exact reads.
        Read prompt resources when relevant.
        You may write Circuitry graphs and request graph runs with run_graph.
