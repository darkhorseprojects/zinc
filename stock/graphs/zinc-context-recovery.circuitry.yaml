circuitry: "0.4"
title: Zinc context recovery

inputs:
  assembled_context:
    type: text
    required: true
  user_turn:
    type: text
    required: true
  session_dir:
    type: text
    required: true

entry: focused_recovery

resources:
  assembled_context:
    type: input
    from: assembled_context

  user_turn:
    type: input
    from: user_turn

  session_dir:
    type: input
    from: session_dir

  focused_recovery:
    type: agent
    identity: Focused context recovery
    inputs:
      - assembled_context
      - user_turn
      - session_dir
    tools:
      - read
      - bash
    expect:
      relevant_context:
        type: list
        items: str
    instructions: |
      Find only context relevant to the current user turn.
      Use assembled_context first. Inspect older session files only if useful.
      Do not answer the user.
      Return concise recovered context for the main assistant.

outputs:
  relevant_context:
    from: focused_recovery.relevant_context