circuitry: "0.5"
title: Zinc context recovery
description: Builds bounded inert context for the active Zinc loop.

exports:
  main:
    run: recovery
    input:
      primary_scope: string
      session_id: string
      cwd: string
      branch: string
      message: string
      reach: string
      budget_chars: string
      runtime_uri: string
      session_uri: string
      branch_uri: string
      logs_uri: string
      session_head: string
      existing_compaction: string
      retained_tail: string
    returns:
      text: recovery.text
      sources: recovery.sources
      notes: recovery.notes

resources:
  recovery:
    model:
      identity: Context recovery
      input:
        - $primary_scope
        - $session_id
        - $cwd
        - $branch
        - $message
        - $reach
        - $budget_chars
        - $runtime_uri
        - $session_uri
        - $branch_uri
        - $logs_uri
        - $session_head
        - $existing_compaction
        - $retained_tail
      tools: []
      instructions: |
        Build concise inert context for the next Zinc turn.

        Inputs are Zinc's stable runtime context contract: scope, session_id,
        cwd, branch, user message, reach, budget_chars, read-only runtime URIs,
        session_head, existing_compaction, and retained_tail.

        The reach value is policy, not a hard rule:
        - session: use only current session material
        - project: prefer current project/session material
        - root: include root-level learnings only when obviously relevant
        - all: use the broadest useful context available in the supplied inputs

        This default graph only consumes bounded current-session material. Custom
        recovery graphs may query supplied runtime_uri/session_uri/branch_uri/logs_uri,
        package memory, root DBs, or external systems according to the same contract.

        Preserve active goals, user corrections, constraints, recent decisions,
        important file paths, failing commands, validation status, and exact URI
        hints for details that may need rereading. The supplied user message is
        the upcoming turn; do not promote prior one-off requests, exact-reply
        prompts, or completed asks into active goals that compete with it.

        Do not answer the user. Do not invent missing facts.
        Fit within budget_chars when possible.
        Output ONLY valid JSON matching: {"text": string, "sources": [string], "notes": [string]}.
        - text: the inert context to provide to the next turn
        - sources: runtime URIs or filesystem paths that justify the context
        - notes: short caveats or policy notes for future recovery
      schema:
        text: string
        sources:
          list: string
        notes:
          list: string
