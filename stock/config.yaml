default_model: qwen-heretic-mtp
scope: project

tools:
  bash: build
  graph_runs: ask

confirm_commands:
  - rm
  - rmdir
  - sudo
  - su
  - chmod
  - chown
  - dd
  - mkfs
  - mount
  - umount
  - kill
  - pkill
  - shutdown
  - reboot

paths:
  graph: stock/graphs/zinc-loop.circuitry.yaml
  context_graph: stock/graphs/zinc-context-recovery.circuitry.yaml
  compaction_graph: stock/graphs/zinc-compaction.circuitry.yaml

runtime:
  provider_max_retries: 5
  tool_max_turns: 12
  compaction_threshold_percent: 70
  compaction_max_tokens: 4096
  session_head_messages: 6
  session_tail_messages: 12
  replay_truncate_chars: 2048
  bash_output_max_bytes: 51200
  bash_output_max_lines: 2000
  bash_capture_max_bytes: 67108864
  file_read_max_bytes: 1048576
  file_range_read_max_bytes: 8388608
  file_edit_max_bytes: 8388608
  resource_read_max_bytes: 33554432
  input_text_file_max_bytes: 8388608
  input_file_max_bytes: 33554432

providers:
  default: local

  local:
    kind: local
    model: qwen3.6-27b-heretic-mtp-q3_k_s
    base_url: http://127.0.0.1:30000/v1

  openai:
    kind: openai
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY

  openrouter:
    kind: openai_compatible
    model: openai/gpt-4.1-mini
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  vllm:
    kind: openai_compatible
    model: Qwen/Qwen2.5-Coder-7B-Instruct
    base_url: http://127.0.0.1:8000/v1

model_bindings:
  Zinc:
    provider: local

models:
  qwen-heretic-mtp:
    model: qwen3.6-27b-heretic-mtp-q3_k_s
    loader:
      engine: llama.cpp
      repo: https://github.com/ggml-org/llama.cpp.git
      ref: master
      hf_repo: mradermacher/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-GGUF
      hf_file: Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved.Q3_K_S.gguf
      mmproj_file: Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved.mmproj-Q8_0.gguf
      cache_type_k: q4_0
      cache_type_v: q4_0
      fit_ctx: 16384
      gpu_layers: fit
      draft_tokens: 2
      reasoning_format: deepseek
      mtp: true
    generation:
      temperature: 0.6
      max_tokens: 1024
    reasoning:
      enabled: true
      effort: low
      budgets:
        off: 0
        low: 256
        medium: 1024
        high: 4096
        extra_high: -1
    protocol:
      reasoning:
        content_markers:
          starts:
            - "<think>\n"
            - "<think>"
          end: "</think>"
