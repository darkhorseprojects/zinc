manifest_version = 2

[package]
name = "zinc"
version = "1.0.0"
kind = "script"
description = "Durable local Portable Agent"

[interpreter]
name = "lua"
version = "5.5.0"
abi = "5.5"

[[orbits.member]]
name = "luacheck"
path = "tools/luacheck-tool"

[[registries]]
name = "zinc"
resolver = "moonstone"
path = "vendor/moonstone-registry"
priority = 100

[[dependencies]]
name = "zinc/stylua"
constraint = "2.5.2"
registry = "zinc"
role = "tool"

[[dependencies]]
name = "zinc/ballad"
constraint = "0.3.3"
registry = "zinc"
role = "tool"

[[dependencies]]
name = "zinc/lua-test-tools"
constraint = "1.0.0"
registry = "zinc"
role = "dev"

[[dependencies]]
name = "zinc/dkjson"
constraint = "2.10-1"
registry = "zinc"
role = "runtime"

[[dependencies]]
name = "zinc/lsqlite3"
constraint = "0.9.7-1"
registry = "zinc"
role = "runtime"

[[dependencies]]
name = "zinc/lua-curl"
constraint = "0.3.13-1"
registry = "zinc"
role = "runtime"

[[dependencies]]
name = "zinc/luv"
constraint = "1.51.0-1"
registry = "zinc"
role = "runtime"

[scripts]
agent-check = "../portable-agents/zig-out/bin/agent check --directory . --entry zinc.md --mount host=host.md --mount design=design.md --trust src.cygnet --trust src.dependencies --trust src.host --trust src.models --trust src.store --lua-memory 96MiB"
benchmark = "lua tools/benchmark.lua"
build-cygnet = "lua tools/cygnet_index.lua data/cygnet.db data/cygnet-index.db aae2cdb1418c1435558584a91181e1cb94459f2506c16f2be4b00e81428deaff"
dist = "moon exec ballad play partiture.lua"
format = "moon exec stylua src tests tools partiture.lua"
format-check = "moon exec stylua --check src tests tools partiture.lua"
integration = "AGENT_BIN=../portable-agents/zig-out/bin/agent lua tools/integration.lua"
lint = "moon orbit exec luacheck -- luacheck --config ../../.luacheckrc ../../src ../../tests ../../tools/benchmark.lua ../../tools/cygnet_index.lua ../../tools/integration.lua ../../tools/release.lua"
release = "lua tools/release.lua"
test = "moon exec --dev busted tests"
