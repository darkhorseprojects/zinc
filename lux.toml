package = "zinc"
version = "1.0.0"
lua = "5.5"

[dependencies]
lsqlite3complete = "0.9.7-1"
lunajson = "1.2.3-1"

[test_dependencies]
busted = "2.3.0-1"

[test]
type = "busted"
flags = ["tests"]

[build]
type = "builtin"

[build.modules]
"src.cygnet" = "src/cygnet.lua"
