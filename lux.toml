package = "zinc"
version = "1.0.0"
lua = "5.5"

[dependencies]
lsqlite3complete = "0.9.7-1"
lunajson = "1.2.3-1"

[test_dependencies]
busted = "2.3.0-1"

[test]
type = "busted"
flags = ["tests"]

[build]
type = "builtin"

[build.modules]
"zinc.history" = "src/history.lua"
"zinc.internal.cygnet" = "src/internal/cygnet.lua"
"zinc.internal.models" = "src/internal/models.lua"
"zinc.internal.retrieval" = "src/internal/retrieval.lua"
"zinc.internal.run" = "src/internal/run.lua"
"zinc.internal.sse" = "src/internal/sse.lua"
"zinc.internal.store" = "src/internal/store.lua"
